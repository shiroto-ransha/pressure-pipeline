# 毎朝 6:47（日本時間）に GDELT の集計とニュースの枠組みの下書きを作り、
# site/ を GitHub Pages に公開する。
# 必要な Secrets: GEMINI_API_KEY（または ANTHROPIC_API_KEY と LLM_PROVIDER=anthropic）
name: daily-update
on:
  schedule:
    - cron: "47 21 * * *"   # UTC 21:47 = JST 6:47
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: GDELT を集計
        run: python collect_gdelt.py
      - name: ニュースの枠組みを下書き
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python news_frames.py
      - name: サイトにデータを配置
        run: mkdir -p site/data && cp data/*.json site/data/
      - name: データをコミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
